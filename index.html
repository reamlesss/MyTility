<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSV Table · Practical Tool</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container app-shell py-4 py-lg-5">

        <!-- Nadpis -->
        <header class="app-header topbar mb-5">
            <div class="brand-mark"><i class="bi bi-table"></i></div>
            <div>
                <div class="eyebrow">MYTILITY · TOOLS</div>
                <div class="brand-name">MyTility</div>
            </div>
            <button id="themeToggle" class="theme-toggle ms-auto" type="button" aria-label="Switch to dark mode">
                <i class="bi bi-moon-stars-fill"></i>
                <span class="d-none d-sm-inline">Dark mode</span>
            </button>
        </header>

        <!-- Home page -->
        <section id="homeSection" class="home-section">
            <div class="home-content animate-fade-up">
                <div class="eyebrow mb-3">MYTILITY · TOOLS</div>
                <h1 class="fw-bold mb-2">Choose a tool</h1>
                <p class="subtitle mb-4">Practical tools for everyday work.</p>

                <div class="home-tools">
                    <button id="openCsvTool" class="home-tool-button" type="button">
                        <span class="home-tool-icon"><i class="bi bi-table"></i></span>
                        <span class="text-start">
                            <strong>CSV Table</strong>
                            <small>Create a table from CSV</small>
                        </span>
                        <i class="bi bi-arrow-right ms-auto"></i>
                    </button>
                </div>
            </div>
        </section>

        <div id="toolSection" class="animate-fade-in" hidden>
            <button id="backToHome" class="back-button mb-3" type="button">
                <i class="bi bi-arrow-left"></i> Back to tools
            </button>

            <main class="main-content mb-5">

                <nav class="tools-menu mb-4" aria-label="Tools">
                    <button id="toolsMenuToggle" class="menu-heading" type="button" aria-expanded="false"
                        aria-controls="toolsDropdown">
                        <i class="bi bi-grid-1x2-fill"></i>
                        <span>Tools</span>
                        <i class="bi bi-chevron-down menu-chevron"></i>
                    </button>
                    <div id="toolsDropdown" class="tools-dropdown" hidden>
                        <button class="tool-button active" type="button">
                            <i class="bi bi-table"></i>
                            <span>CSV Table</span>
                            <i class="bi bi-check2 ms-auto"></i>
                        </button>
                    </div>
                </nav>

                <!-- Vstup CSV -->
                <div class="card input-card shadow-sm">

                    <div class="card-body p-4">

                        <div class="section-heading mb-4">
                            <div class="section-icon"><i class="bi bi-cloud-arrow-up"></i></div>
                            <div>
                                <h4 class="mb-1">Input data</h4>
                                <p class="text-secondary mb-0">Upload a file or paste CSV directly into the field.</p>
                            </div>
                        </div>


                        <!-- File upload -->
                        <div class="mb-4">

                            <label for="csvFile" class="form-label fw-semibold">
                                Upload CSV file
                            </label>

                            <label for="csvFile" class="upload-zone">
                                <i class="bi bi-file-earmark-spreadsheet"></i>
                                <span><strong>Choose a CSV file</strong> or drag it here</span>
                                <small>Supported format: .csv</small>
                            </label>
                            <input type="file" id="csvFile" class="visually-hidden" accept=".csv">

                            <div id="fileInfo" class="mt-2 text-secondary small"></div>

                        </div>


                        <!-- Divider -->
                        <div class="divider text-secondary mb-4">
                            <span>or paste text</span>
                        </div>


                        <!-- Text input -->
                        <div class="mb-3">

                            <label for="csvText" class="form-label fw-semibold">
                                Paste CSV as text
                            </label>

                            <textarea id="csvText" class="form-control" rows="8" placeholder="Name,Age,City
Peter,21,Prague
Martin,24,Brno
Thomas,19,Benesov"></textarea>

                        </div>


                        <!-- Table name -->
                        <div class="mb-3">

                            <label for="tableTitleInput" class="form-label fw-semibold">
                                Table name
                            </label>

                            <input id="tableTitleInput" class="form-control" type="text" value="CSV Table"
                                placeholder="For example, Migration overview" maxlength="100">

                        </div>


                        <!-- Create table -->
                        <button id="createTableButton" class="btn btn-primary" type="button">
                            <i class="bi bi-magic me-2"></i>Create table
                        </button>

                    </div>

                </div>

            </main>


            <!-- Tabulka -->
            <div id="tableSection" class="d-none">

                <div class="d-flex justify-content-between align-items-center mb-3">

                    <div>
                        <div class="eyebrow">RESULT</div>
                        <h4 class="mb-0">Table preview</h4>
                    </div>

                    <div class="d-flex gap-2">

                        <button id="exportButton" class="btn btn-success btn-sm" type="button">
                            <i class="bi bi-download me-1"></i>Download as PNG
                        </button>

                        <button id="clearButton" class="btn btn-outline-danger btn-sm" type="button">
                            <i class="bi bi-trash3 me-1"></i>Clear
                        </button>

                    </div>

                </div>


                <!-- This section will be exported -->
                <div id="tableExport" class="table-export">

                    <div class="table-export-title">
                        CSV Table
                    </div>

                    <div class="table-responsive">

                        <table id="csvTable" class="table table-striped table-hover mb-0"></table>

                    </div>

                </div>

            </div>
        </div>

    </div>


    <!-- Papa Parse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.6.1/papaparse.min.js"></script>

    <!-- html-to-image -->
    <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>

    <!-- Custom JavaScript -->
    <script src="script.js"></script>

</body>

</html>
