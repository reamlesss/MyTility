<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSV Table</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Vlastní CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container py-5">

        <!-- Nadpis -->
        <div class="text-center mb-5">
            <h1 class="fw-bold">CSV Table</h1>

            <p class="text-secondary">
                Nahraj CSV soubor nebo vlož CSV jako text.
            </p>
        </div>


        <!-- Vstup CSV -->
        <div class="card shadow-sm mb-4">

            <div class="card-body p-4">

                <h4 class="mb-4">Vstupní data</h4>


                <!-- Nahrání souboru -->
                <div class="mb-4">

                    <label for="csvFile" class="form-label fw-semibold">
                        Nahrát CSV soubor
                    </label>

                    <input
                        type="file"
                        id="csvFile"
                        class="form-control"
                        accept=".csv"
                    >

                    <div
                        id="fileInfo"
                        class="mt-2 text-secondary small"
                    ></div>

                </div>


                <!-- Oddělovač -->
                <div class="text-center text-secondary mb-4">
                    nebo
                </div>


                <!-- Vložení textu -->
                <div class="mb-3">

                    <label
                        for="csvText"
                        class="form-label fw-semibold"
                    >
                        Vložit CSV jako text
                    </label>

                    <textarea
                        id="csvText"
                        class="form-control"
                        rows="8"
                        placeholder="Jméno,Věk,Město
Petr,21,Praha
Martin,24,Brno
Tomáš,19,Benešov"
                    ></textarea>

                </div>


                <!-- Vytvoření tabulky -->
                <button
                    id="createTableButton"
                    class="btn btn-primary"
                    type="button"
                >
                    Vytvořit tabulku
                </button>

            </div>

        </div>


        <!-- Tabulka -->
        <div id="tableSection" class="d-none">

            <div class="d-flex justify-content-between align-items-center mb-3">

                <h4 class="mb-0">
                    Náhled tabulky
                </h4>

                <div class="d-flex gap-2">

                    <button
                        id="exportButton"
                        class="btn btn-success btn-sm"
                        type="button"
                    >
                        Stáhnout jako PNG
                    </button>

                    <button
                        id="clearButton"
                        class="btn btn-outline-danger btn-sm"
                        type="button"
                    >
                        Vymazat
                    </button>

                </div>

            </div>


            <!-- Toto se bude exportovat -->
            <div
                id="tableExport"
                class="table-export"
            >

                <div class="table-export-title">
                    CSV Table
                </div>

                <div class="table-responsive">

                    <table
                        id="csvTable"
                        class="table table-striped table-hover mb-0"
                    ></table>

                </div>

            </div>

        </div>

    </div>


    <!-- Papa Parse -->
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.6.1/papaparse.min.js"
    ></script>

    <!-- html-to-image -->
    <script
        src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"
    ></script>

    <!-- Vlastní JavaScript -->
    <script src="script.js"></script>

</body>
</html>
